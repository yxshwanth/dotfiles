# ---- look: cockpit bar at the bottom ----
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=@FG2@"
set -g status-left-length 60
set -g status-right-length 160
set -g status-left "#[fg=@ACCENT@,bg=default]#[bg=@ACCENT@,fg=@BG@,bold]  #S #[fg=@ACCENT@,bg=default,nobold] "
setw -g window-status-separator " "
setw -g window-status-format "#[fg=@BG2@,bg=default]#[bg=@BG2@,fg=@FG@,bold] #I #W #[fg=@BG2@,bg=default,nobold]"
setw -g window-status-current-format "#[fg=@ACCENT2@,bg=default]#[bg=@ACCENT2@,fg=@BG@,bold] #I #W#{?window_zoomed_flag, ,} #[fg=@ACCENT2@,bg=default,nobold]"
set -g status-right "#{?client_prefix,#[fg=@RED@#,bold]PREFIX ,}#(~/.config/tmux/cockpit.sh '#{pane_current_path}')#[fg=@PURPLE@,bg=default]#[bg=@PURPLE@,fg=@BG@,bold]  %H:%M #[fg=@PURPLE@,bg=default,nobold]"

set -g pane-border-lines heavy
set -g pane-border-style "fg=@BG2@"
set -g pane-active-border-style "fg=@ACCENT@"
set -g message-style "bg=@BG1@,fg=@ACCENT@"
set -g message-command-style "bg=@BG1@,fg=@ACCENT@"
setw -g mode-style "bg=@BG3@,fg=@FGB@"
set -g popup-border-lines rounded
set -g popup-border-style "fg=@ACCENT@"
