# ~/.config/tmux/tmux.conf   Prefix = Ctrl+a. Colors come from `ox theme` (see bottom).

# ---- terminal / colors ----
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB:usstyle,wezterm:RGB:usstyle"
set -g focus-events on
set -g set-clipboard on   # y in copy mode reaches the system clipboard (OSC 52)
set -sg escape-time 0

# image previews (yazi) need passthrough
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# make sure Homebrew tools are found in popups
run-shell 'tmux set-environment -g PATH "/opt/homebrew/bin:/usr/local/bin:$HOME/.local/bin:$PATH"'

# ---- behaviour ----
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 100000
set -g display-time 2000
set -g detach-on-destroy off   # closing a session jumps to another one instead of dropping you out
setw -g mode-keys vi
setw -g aggressive-resize on
set -g automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"

# ---- prefix: Ctrl+a ----
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ---- splits and windows (open in the current folder) ----
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind x kill-pane
bind R source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"

# ---- move between panes: prefix + h/j/k/l ----
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ---- resize: prefix + H/J/K/L (hold to repeat) ----
bind -r H resize-pane -L 4
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 4

# ---- Ctrl+h/j/k/l without prefix, shared with Neovim (vim-tmux-navigator) ----
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind C-l send-keys C-l   # prefix + Ctrl+l clears the screen

# ---- copy mode (prefix + [ ) ----
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ---- popups and sessions ----
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
bind y display-popup -E -w 90% -h 90% -d "#{pane_current_path}" yazi
bind b display-popup -E -w 90% -h 90% btop
bind o display-popup -E -w 70% -h 60% "~/.local/bin/dev -p"
bind f display-popup -E -w 50% -h 50% "tmux ls | cut -d: -f1 | fzf --prompt='session ❯ ' | xargs -I{} tmux switch-client -t '{}'"
bind s choose-tree -Zs

# ---- look: rendered from ~/.config/ox/templates by `ox theme` ----
source-file -q ~/.config/ox/current/tmux.conf
bind Space display-popup -E -w 60% -h 60% "ox menu"
bind ? display-popup -E -w 80% -h 80% "ox keys"

# ---- plugins: sessions survive restarts (prefix + I installs, prefix + U updates) ----
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

# keep this line last
if "test -f ~/.config/tmux/plugins/tpm/tpm" "run '~/.config/tmux/plugins/tpm/tpm'"
